name: Build 100gram APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # позволяет запускать сборку кнопкой вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android NDK (r27b)
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: '27.2.12479018'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build AfatDebug APK
      run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug -x lint -x test --max-workers=2

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 100gram-app-apk
        path: TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/app.apk
